<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halaman Kosong | Antariksa Biru</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #0a1128, #020617, #000000);
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', system-ui, -apple-system, 'Inter', sans-serif;
            color: #e2f0ff;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            backdrop-filter: blur(2px);
        }

        .error-card {
            background: rgba(2, 12, 27, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 3rem;
            padding: 2.8rem 2rem;
            max-width: 620px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(64, 160, 255, 0.4);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 180, 255, 0.15), 0 0 25px rgba(0, 100, 255, 0.3);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            animation: floatGlow 6s infinite alternate;
        }

        .error-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(80, 180, 255, 0.4), 0 0 35px rgba(0, 150, 255, 0.5);
        }

        @keyframes floatGlow {
            0% {
                border-color: rgba(64, 160, 255, 0.3);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 180, 255, 0.2);
            }
            100% {
                border-color: rgba(100, 200, 255, 0.7);
                box-shadow: 0 30px 55px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(70, 190, 255, 0.5), 0 0 35px rgba(0, 140, 255, 0.4);
            }
        }

        .icon-space {
            font-size: 5.5rem;
            letter-spacing: 12px;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 8px #3a86ff);
        }

        h1 {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #b8e1ff, #3b82f6, #1e3a8a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(59,130,246,0.4);
            letter-spacing: 6px;
            margin-bottom: 0.25rem;
            line-height: 1;
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0.5rem 0 1rem 0;
            letter-spacing: 2px;
            color: #bfd9ff;
            text-transform: uppercase;
            background: linear-gradient(120deg, #d9f0ff, #90caf9);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 1.5rem 0;
            color: #c7e2ff;
            font-weight: 400;
            border-top: 1px dashed rgba(59,130,246,0.5);
            border-bottom: 1px dashed rgba(59,130,246,0.5);
            padding: 1rem 0;
            backdrop-filter: blur(4px);
        }

        .error-detail {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin: 1.8rem 0;
            font-size: 0.9rem;
            flex-wrap: wrap;
            color: #9bc0ff;
        }

        .error-detail span {
            background: rgba(0, 30, 60, 0.6);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            letter-spacing: 1px;
            font-family: monospace;
            border: 1px solid rgba(71, 166, 255, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            margin-top: 1.8rem;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(10, 30, 55, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #3b82f6;
            padding: 0.8rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #e2f0ff;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #0f2b4d, #0a1a2f);
            border-color: #60a5fa;
            box-shadow: 0 0 8px rgba(96,165,250,0.5);
        }

        .btn-primary:hover {
            background: linear-gradient(95deg, #1e3a5f, #0f2a44);
            border-color: #90caff;
            box-shadow: 0 0 15px #3b82f6;
            transform: scale(1.02);
            color: white;
        }

        .btn-outline {
            border-color: #478eff;
            background: rgba(0, 0, 0, 0.4);
        }

        .btn-outline:hover {
            background: #1e3a8a50;
            border-color: #b9d9ff;
            box-shadow: 0 0 12px rgba(59,130,246,0.6);
            transform: scale(1.02);
        }

        .cosmic-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            opacity: 0.8;
            font-family: monospace;
            color: #8bb9fe;
        }

        @media (max-width: 550px) {
            h1 {
                font-size: 5rem;
            }
            h2 {
                font-size: 1.4rem;
            }
            .icon-space {
                font-size: 3.8rem;
            }
            .error-card {
                padding: 1.8rem 1.2rem;
            }
            .message {
                font-size: 1rem;
            }
            .btn {
                padding: 0.6rem 1.3rem;
                font-size: 0.85rem;
            }
        }

        @keyframes subtlePulse {
            0% { text-shadow: 0 0 2px #3b82f6; }
            100% { text-shadow: 0 0 14px #60a5fa; }
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div class="content">
    <div class="error-card">
        <div class="icon-space">
            🚀✨🌌
        </div>
        <h1>404</h1>
        <h2>Halaman Kosong</h2>
        <div class="message">
            ⚡ Tidak ada apapun di sini ⚡<br>
            Halaman yang anda cari hilang di kedalaman antariksa biru.<br>
            <span style="font-size:0.9rem;">[ error : tidak ada data / ruang hampa ]</span>
        </div>
        <div class="error-detail">
            <span>✦ status: void ✦</span>
            <span>🌠 cosmic emptiness 🌠</span>
            <span>💠 404 - not found 💠</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="refreshBtn">⟳ Muat Ulang</button>
            <button class="btn btn-outline" id="backBtn">⬩ Kembali ⬩</button>
        </div>
        <div class="cosmic-note">
            ✦ antariksa biru · tidak terdapat elemen apapun untuk ditampilkan ✦
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('starCanvas');
    let ctx = canvas.getContext('2d');
    let starsArray = [];
    let planetsArray = [];
    let width = window.innerWidth;
    let height = window.innerHeight;

    function random(min, max) {
        return min + Math.random() * (max - min);
    }

    function generateStars(w, h, count) {
        const stars = [];
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                radius: random(0.8, 2.8),
                alpha: random(0.3, 1),
                color: `rgba(255, 235, 200, ${random(0.4, 0.95)})`
            });
        }
        return stars;
    }

    function generatePlanets(w, h) {
        const planets = [];
        const planetCount = Math.floor(random(2, 4));
        for (let i = 0; i < planetCount; i++) {
            const radius = random(18, 52);
            planets.push({
                x: random(radius + 15, w - radius - 15),
                y: random(radius + 20, h - radius - 20),
                radius: radius,
                alpha: random(0.08, 0.28),
                color: `hsla(${random(190, 260)}, 70%, 55%, ${random(0.12, 0.3)})`
            });
        }
        return planets;
    }

    function drawStarsAndPlanets() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        
        for (let p of planetsArray) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = `rgba(70, 130, 255, 0.6)`;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180, 220, 255, 0.15)`;
            ctx.fill();
        }
        
        for (let star of starsArray) {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.shadowBlur = 3;
            ctx.shadowColor = `rgba(210, 230, 255, 0.7)`;
            ctx.fill();
        }
        ctx.shadowBlur = 0;
        
        for (let i = 0; i < 35; i++) {
            if (i % 2 === 0) continue;
            const tx = Math.random() * width;
            const ty = Math.random() * height;
            ctx.beginPath();
            ctx.arc(tx, ty, random(0.3, 1.2), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 245, 210, ${random(0.2, 0.65)})`;
            ctx.fill();
        }
    }

    function initCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        const starCount = Math.min(420, Math.max(200, Math.floor((width * height) / 5800)));
        starsArray = generateStars(width, height, starCount);
        planetsArray = generatePlanets(width, height);
        drawStarsAndPlanets();
    }

    function handleResize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        const starCount = Math.min(420, Math.max(200, Math.floor((width * height) / 5800)));
        starsArray = generateStars(width, height, starCount);
        planetsArray = generatePlanets(width, height);
        drawStarsAndPlanets();
    }

    window.addEventListener('resize', () => {
        handleResize();
    });

    window.addEventListener('load', () => {
        initCanvas();
        animateParticles();
    });
    
    function animateParticles() {
        let step = 0;
        function twinkleEffect() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            for (let p of planetsArray) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `rgba(70, 130, 255, 0.6)`;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180, 220, 255, 0.15)`;
                ctx.fill();
            }
            for (let i = 0; i < starsArray.length; i++) {
                const star = starsArray[i];
                let dynamicAlpha = star.alpha;
                if (step % 37 === i % 11) {
                    dynamicAlpha = Math.min(0.98, star.alpha * (0.7 + Math.sin(Date.now() * 0.0015 + i) * 0.3));
                } else {
                    dynamicAlpha = star.alpha;
                }
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 200, ${dynamicAlpha})`;
                ctx.shadowBlur = 2.5;
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            for (let i = 0; i < 25; i++) {
                const tx = (Math.sin(Date.now() * 0.0007 + i) * 1.2 + i * 131) % width;
                const ty = (Math.cos(Date.now() * 0.0005 + i * 2) * 1.2 + i * 87) % height;
                ctx.beginPath();
                ctx.arc(tx, ty, random(0.5, 1.5), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 220, 255, ${0.2 + Math.sin(Date.now() * 0.002 + i) * 0.1})`;
                ctx.fill();
            }
            requestAnimationFrame(() => {
                step++;
                if (step > 1000) step = 0;
                twinkleEffect();
            });
        }
        twinkleEffect();
    }

    const refreshBtn = document.getElementById('refreshBtn');
    const backBtn = document.getElementById('backBtn');
    
    refreshBtn.addEventListener('click', () => {
        window.location.reload();
    });
    
    backBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = '/';
        }
    });
    
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            handleResize();
        }, 120);
    });
</script>
</body>
</html>
